# Render.com Blueprint Configuration for Knowtis
# This file defines all services that Render will deploy from this repository.
# 
# Setup Instructions:
# 1. Create a Render account at https://render.com
# 2. Click "New Blueprint Instance" and connect this repository
# 3. Render will automatically provision all services defined below
# 4. Set required environment variables in Render Dashboard after deployment

services:
  # ══════════════════════════════════════════════════════════════════════════════
  # PostgreSQL Database (Free Tier - expires after 90 days)
  # ══════════════════════════════════════════════════════════════════════════════
  - type: pserv
    name: knowtis-postgres
    plan: free
    region: oregon
    ipAllowList: []
    # Note: pgvector extension needs to be enabled manually after creation
    # Connect via psql and run: CREATE EXTENSION IF NOT EXISTS vector;

  # ══════════════════════════════════════════════════════════════════════════════
  # Redis Cache (Free Tier)
  # ══════════════════════════════════════════════════════════════════════════════
  - type: redis
    name: knowtis-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # ══════════════════════════════════════════════════════════════════════════════
  # FastAPI Backend (Free Tier - spins down after 15 min inactivity)
  # ══════════════════════════════════════════════════════════════════════════════
  - type: web
    name: knowtis-backend
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: knowtis-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: knowtis-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: knowtis-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: knowtis-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 30
      - key: BACKEND_URL
        value: https://knowtis-backend.onrender.com
      - key: FRONTEND_URL
        value: https://knowtis-frontend.vercel.app
      - key: SIMILARITY_THRESHOLD
        value: 0.75
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: CELERY_TASK_ALWAYS_EAGER
        value: false
      - key: RATE_LIMIT_DEFAULT
        value: 100/minute
      - key: RATE_LIMIT_AUTH
        value: 10/minute
      - key: RATE_LIMIT_OCR_FREE
        value: 10/hour
      - key: RATE_LIMIT_OCR_PREMIUM
        value: 50/hour

  # ══════════════════════════════════════════════════════════════════════════════
  # Celery Worker (Background Service - Free Tier)
  # ══════════════════════════════════════════════════════════════════════════════
  - type: worker
    name: knowtis-worker
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile.worker
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: knowtis-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: knowtis-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: knowtis-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: knowtis-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false
      - key: SIMILARITY_THRESHOLD
        value: 0.75
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json

  # ══════════════════════════════════════════════════════════════════════════════
  # WhatsApp Connector (Node.js - Free Tier)
  # ══════════════════════════════════════════════════════════════════════════════
  - type: web
    name: knowtis-whatsapp
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    rootDir: ./whatsapp_connector
    healthCheckPath: /status
    disk:
      name: whatsapp-auth-storage
      mountPath: /opt/render/project/src/auth_info_baileys
      sizeGB: 1
    envVars:
      - key: PORT
        value: 3001
      - key: FASTAPI_WEBHOOK_URL
        value: https://knowtis-backend.onrender.com/api/v1/whatsapp/webhook
      - key: WEBHOOK_SECRET
        sync: false
      - key: NODE_ENV
        value: production
