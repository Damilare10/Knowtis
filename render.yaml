services:
  - type: web
    name: knowtis-whatsapp-connector
    repo: https://github.com/Damilare10/Knowtis.git
    plan: free
    region: oregon
    buildCommand: cd whatsapp_connector && npm install
    startCommand: cd whatsapp_connector && node server.js
    env: node
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
